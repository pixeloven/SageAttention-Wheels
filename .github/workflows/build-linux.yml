name: Build Linux wheel

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # A release. The version lives in VERSION; the tag only selects it.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      sage_ref:
        description: Canonical thu-ml/SageAttention tag, branch, or commit
        required: true
        default: v2.2.0
        type: string
      python_version:
        description: Python version available in the CUDA Ubuntu image
        required: true
        default: "3.12"
        type: string
      torch_version:
        description: Exact PyTorch version
        required: true
        default: "2.13.0"
        type: string
      torch_index:
        description: PyTorch CUDA wheel channel
        required: true
        default: cu130
        type: string
      cuda_version:
        description: NVIDIA CUDA devel image version
        required: true
        default: "13.0.2"
        type: string
      cuda_arch_list:
        description: Semicolon-separated Torch CUDA architecture list
        required: true
        default: "8.0;8.6;8.9;9.0;12.0"
        type: string

permissions:
  contents: read

env:
  # Pull requests and pushes to main build this tuple. Keep these fallbacks
  # aligned with the workflow_dispatch defaults, Dockerfile ARGs, and README
  # compatibility table.
  SAGE_REF: ${{ inputs.sage_ref || 'v2.2.0' }}
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
  TORCH_VERSION: ${{ inputs.torch_version || '2.13.0' }}
  TORCH_INDEX: ${{ inputs.torch_index || 'cu130' }}
  CUDA_VERSION: ${{ inputs.cuda_version || '13.0.2' }}
  CUDA_ARCH_LIST: ${{ inputs.cuda_arch_list || '8.0;8.6;8.9;9.0;12.0' }}

concurrency:
  group: build-linux-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sage_commit: ${{ steps.source.outputs.sha }}
      architectures: ${{ steps.architectures.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve canonical source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/thu-ml/SageAttention/commits/${SAGE_REF}" --jq .sha)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve architecture matrix
        id: architectures
        run: |
          matrix=$(jq -cn --arg value "$CUDA_ARCH_LIST" '
            $value
            | split(";")
            | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | unique as $arches
            | if ($arches | length) == 0 then
                error("CUDA architecture list is empty")
              elif all($arches[]; . as $arch | ["8.0", "8.6", "8.9", "9.0", "12.0"] | index($arch)) | not then
                error("unsupported CUDA architecture requested")
              else
                $arches | map({capability: ., tag: ("sm" + gsub("\\."; ""))})
              end')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.source.outputs.architectures) }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and validate wheel
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: export
          outputs: type=local,dest=dist
          build-args: |
            SAGE_COMMIT=${{ needs.source.outputs.sage_commit }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            TORCH_INDEX=${{ env.TORCH_INDEX }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            CUDA_ARCH_LIST=${{ matrix.architecture.capability }}
            CUDA_ARCH_TAG=${{ matrix.architecture.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Record build provenance
        env:
          SAGE_COMMIT: ${{ needs.source.outputs.sage_commit }}
          CUDA_ARCH: ${{ matrix.architecture.capability }}
          CUDA_ARCH_TAG: ${{ matrix.architecture.tag }}
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          mv dist/TOOLCHAIN.txt "dist/TOOLCHAIN-${CUDA_ARCH_TAG}.txt"
          sha256sum "$wheel" | tee "dist/SHA256SUMS-${CUDA_ARCH_TAG}"
          {
            echo "upstream_repository=https://github.com/thu-ml/SageAttention"
            echo "upstream_ref=$SAGE_REF"
            echo "upstream_commit=$SAGE_COMMIT"
            echo "python=$PYTHON_VERSION"
            echo "torch=$TORCH_VERSION"
            echo "torch_index=$TORCH_INDEX"
            echo "cuda=$CUDA_VERSION"
            echo "cuda_arch=$CUDA_ARCH"
          } | tee "dist/BUILD-INFO-${CUDA_ARCH_TAG}.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sageattention-${{ env.TORCH_INDEX }}-torch${{ env.TORCH_VERSION }}-${{ matrix.architecture.tag }}
          path: dist/

  publish:
    # A release, and only a release. `workflow_dispatch` still builds any tuple
    # for experimentation; it no longer publishes, so there is exactly one path
    # by which bytes reach a release asset.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      # VERSION and CHANGELOG.md are read below, so the repo has to be here.
      - uses: actions/checkout@v7.0.1

      - name: Download built wheel
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: sageattention-${{ env.TORCH_INDEX }}-torch${{ env.TORCH_VERSION }}-sm*
          merge-multiple: true
          path: dist

      - name: Attest wheel
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.whl

      # Minted just above. Verifying it here is what makes it a control rather
      # than a file we happen to produce.
      - name: The attestation verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wheel in dist/*.whl; do
            gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY"
            echo "attested: $(basename "$wheel")"
          done

      - name: The tag matches VERSION
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF#refs/tags/v}"
          declared="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$tagged" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::v${tagged} is not a release version. Prereleases are not published."
            exit 1
          fi
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag v${tagged} does not match VERSION (${declared})"
            exit 1
          fi
          echo "version ${tagged} confirmed"
          echo "VERSION_NUMBER=${tagged}" >> "$GITHUB_ENV"

      - name: Release notes, from the changelog
        run: |
          set -euo pipefail
          heading="$(grep -m1 -F "## ${VERSION_NUMBER} " CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## ${VERSION_NUMBER}' section. Add one before tagging."
            exit 1
          fi
          case "$heading" in
            *unreleased*) echo "::error::CHANGELOG.md still marks ${VERSION_NUMBER} unreleased."; exit 1 ;;
          esac
          awk -v want="## ${VERSION_NUMBER} " 'index($0, want)==1 {g=1; next} g && /^## / {exit} g {print}' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::the ${VERSION_NUMBER} section is empty"; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SAGE_COMMIT: ${{ needs.source.outputs.sage_commit }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NUMBER}"

          # Refuse rather than clobber. The previous guard compared BUILD-INFO,
          # which records only the compatibility tuple -- so a rebuild from a
          # CHANGED BUILD SCRIPT produced identical BUILD-INFO, passed, and
          # replaced wheel bytes under a tag consumers pin by URL. There is no
          # replace path now: a rebuild is a new version.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release ${tag} already exists. A rebuild is a new version -- bump VERSION."
            exit 1
          fi

          {
            echo ""
            echo "Built from thu-ml/SageAttention \`${SAGE_COMMIT}\` (\`${SAGE_REF}\`),"
            echo "Torch ${TORCH_VERSION} \`${TORCH_INDEX}\`, CUDA ${CUDA_VERSION}."
            echo ""
            echo "Each wheel is named for the target it was built for, and ships"
            echo "\`SHA256SUMS-*\`, \`BUILD-INFO-*\` and \`TOOLCHAIN-*\` beside it."
            echo "Pin by URL and verify against the checksum -- these releases are"
            echo "not immutable."
          } >> notes.md

          gh release create "$tag" dist/* \
            --title "v${VERSION_NUMBER} — SageAttention ${SAGE_REF} · ${TORCH_INDEX} · Torch ${TORCH_VERSION}" \
            --notes-file notes.md --verify-tag
          gh release view "$tag" --json assets --jq '.assets[].name' | sed 's/^/published: /' 
