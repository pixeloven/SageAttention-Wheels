name: Build Linux wheel

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sage_ref:
        description: Canonical thu-ml/SageAttention tag, branch, or commit
        required: true
        default: v2.2.0
        type: string
      python_version:
        description: Python version available in the CUDA Ubuntu image
        required: true
        default: "3.12"
        type: string
      torch_version:
        description: Exact PyTorch version
        required: true
        default: "2.13.0"
        type: string
      torch_index:
        description: PyTorch CUDA wheel channel
        required: true
        default: cu130
        type: string
      cuda_version:
        description: NVIDIA CUDA devel image version
        required: true
        default: "13.0.2"
        type: string
      cuda_arch_list:
        description: Semicolon-separated Torch CUDA architecture list
        required: true
        default: "8.0;8.6;8.9;9.0;10.0;12.0;12.1"
        type: string
      publish_release:
        description: Publish the wheel as a GitHub release asset
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Pull requests build this tuple. Keep these fallbacks aligned with the
  # workflow_dispatch defaults, Dockerfile ARGs, and README compatibility table.
  SAGE_REF: ${{ inputs.sage_ref || 'v2.2.0' }}
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
  TORCH_VERSION: ${{ inputs.torch_version || '2.13.0' }}
  TORCH_INDEX: ${{ inputs.torch_index || 'cu130' }}
  CUDA_VERSION: ${{ inputs.cuda_version || '13.0.2' }}
  CUDA_ARCH_LIST: ${{ inputs.cuda_arch_list || '8.0;8.6;8.9;9.0;10.0;12.0;12.1' }}

concurrency:
  group: build-linux-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sage_commit: ${{ steps.source.outputs.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve canonical source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/thu-ml/SageAttention/commits/${SAGE_REF}" --jq .sha)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and validate wheel
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          outputs: type=local,dest=dist
          build-args: |
            SAGE_COMMIT=${{ steps.source.outputs.sha }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            TORCH_INDEX=${{ env.TORCH_INDEX }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            CUDA_ARCH_LIST=${{ env.CUDA_ARCH_LIST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Record build provenance
        env:
          SAGE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          sha256sum "$wheel" | tee dist/SHA256SUMS
          {
            echo "upstream_repository=https://github.com/thu-ml/SageAttention"
            echo "upstream_ref=$SAGE_REF"
            echo "upstream_commit=$SAGE_COMMIT"
            echo "python=$PYTHON_VERSION"
            echo "torch=$TORCH_VERSION"
            echo "torch_index=$TORCH_INDEX"
            echo "cuda=$CUDA_VERSION"
            echo "cuda_arch_list=$CUDA_ARCH_LIST"
          } | tee dist/BUILD-INFO.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sageattention-${{ env.TORCH_INDEX }}-torch${{ env.TORCH_VERSION }}
          path: dist/

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          name: sageattention-${{ env.TORCH_INDEX }}-torch${{ env.TORCH_VERSION }}
          path: dist

      - name: Attest wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Publish GitHub release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          SAGE_COMMIT: ${{ needs.build.outputs.sage_commit }}
        run: |
          tag="sageattention-${SAGE_REF}-${TORCH_INDEX}-torch${TORCH_VERSION}"
          title="SageAttention ${SAGE_REF} · ${TORCH_INDEX} · Torch ${TORCH_VERSION}"
          notes="Built from thu-ml/SageAttention commit ${SAGE_COMMIT} with CUDA ${CUDA_VERSION}."
          if gh release view "$tag" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            trap 'rm -rf "$existing"' EXIT
            gh release download "$tag" --pattern BUILD-INFO.txt --dir "$existing"
            if ! cmp -s "$existing/BUILD-INFO.txt" dist/BUILD-INFO.txt; then
              echo "Refusing to replace release assets built from a different compatibility tuple" >&2
              diff -u "$existing/BUILD-INFO.txt" dist/BUILD-INFO.txt || true
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$title" --notes "$notes"
          fi
