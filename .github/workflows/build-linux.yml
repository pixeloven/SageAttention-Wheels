name: Build Linux wheel

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sage_ref:
        description: Canonical thu-ml/SageAttention tag, branch, or commit
        required: true
        default: v2.2.0
        type: string
      python_version:
        description: Python version available in the CUDA Ubuntu image
        required: true
        default: "3.12"
        type: string
      torch_version:
        description: Exact PyTorch version
        required: true
        default: "2.13.0"
        type: string
      torch_index:
        description: PyTorch CUDA wheel channel
        required: true
        default: cu130
        type: string
      cuda_version:
        description: NVIDIA CUDA devel image version
        required: true
        default: "13.0.2"
        type: string
      cuda_arch_list:
        description: Semicolon-separated Torch CUDA architecture list
        required: true
        default: "8.0;8.6;8.9;9.0;12.0"
        type: string
      publish_release:
        description: Publish the wheel as a GitHub release asset
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Pull requests build this tuple. Keep these fallbacks aligned with the
  # workflow_dispatch defaults, Dockerfile ARGs, and README compatibility table.
  SAGE_REF: ${{ inputs.sage_ref || 'v2.2.0' }}
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
  TORCH_VERSION: ${{ inputs.torch_version || '2.13.0' }}
  TORCH_INDEX: ${{ inputs.torch_index || 'cu130' }}
  CUDA_VERSION: ${{ inputs.cuda_version || '13.0.2' }}
  CUDA_ARCH_LIST: ${{ inputs.cuda_arch_list || '8.0;8.6;8.9;9.0;12.0' }}

concurrency:
  group: build-linux-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sage_commit: ${{ steps.source.outputs.sha }}
      architectures: ${{ steps.architectures.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve canonical source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/thu-ml/SageAttention/commits/${SAGE_REF}" --jq .sha)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve architecture matrix
        id: architectures
        run: |
          matrix=$(jq -cn --arg value "$CUDA_ARCH_LIST" '
            $value
            | split(";")
            | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | unique as $arches
            | if ($arches | length) == 0 then
                error("CUDA architecture list is empty")
              elif all($arches[]; . as $arch | ["8.0", "8.6", "8.9", "9.0", "12.0"] | index($arch)) | not then
                error("unsupported CUDA architecture requested")
              else
                $arches | map({capability: ., tag: ("sm" + gsub("\\."; ""))})
              end')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.source.outputs.architectures) }}

    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and validate wheel
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          outputs: type=local,dest=dist
          build-args: |
            SAGE_COMMIT=${{ needs.source.outputs.sage_commit }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            TORCH_INDEX=${{ env.TORCH_INDEX }}
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            CUDA_ARCH_LIST=${{ matrix.architecture.capability }}
            CUDA_ARCH_TAG=${{ matrix.architecture.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Record build provenance
        env:
          SAGE_COMMIT: ${{ needs.source.outputs.sage_commit }}
          CUDA_ARCH: ${{ matrix.architecture.capability }}
          CUDA_ARCH_TAG: ${{ matrix.architecture.tag }}
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          mv dist/TOOLCHAIN.txt "dist/TOOLCHAIN-${CUDA_ARCH_TAG}.txt"
          sha256sum "$wheel" | tee "dist/SHA256SUMS-${CUDA_ARCH_TAG}"
          {
            echo "upstream_repository=https://github.com/thu-ml/SageAttention"
            echo "upstream_ref=$SAGE_REF"
            echo "upstream_commit=$SAGE_COMMIT"
            echo "python=$PYTHON_VERSION"
            echo "torch=$TORCH_VERSION"
            echo "torch_index=$TORCH_INDEX"
            echo "cuda=$CUDA_VERSION"
            echo "cuda_arch=$CUDA_ARCH"
          } | tee "dist/BUILD-INFO-${CUDA_ARCH_TAG}.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sageattention-${{ env.TORCH_INDEX }}-torch${{ env.TORCH_VERSION }}-${{ matrix.architecture.tag }}
          path: dist/

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [source, build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ inputs.sage_ref }}-${{ inputs.torch_index }}-torch${{ inputs.torch_version }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          pattern: sageattention-${{ env.TORCH_INDEX }}-torch${{ env.TORCH_VERSION }}-sm*
          merge-multiple: true
          path: dist

      - name: Attest wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Publish GitHub release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          SAGE_COMMIT: ${{ needs.source.outputs.sage_commit }}
        run: |
          tag="sageattention-${SAGE_REF}-${TORCH_INDEX}-torch${TORCH_VERSION}"
          title="SageAttention ${SAGE_REF} · ${TORCH_INDEX} · Torch ${TORCH_VERSION}"
          notes="Built from thu-ml/SageAttention commit ${SAGE_COMMIT} with CUDA ${CUDA_VERSION}."
          if gh release view "$tag" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            trap 'rm -rf "$existing"' EXIT
            gh release download "$tag" --pattern 'BUILD-INFO-sm*.txt' --dir "$existing"
            for info in dist/BUILD-INFO-sm*.txt; do
              existing_info="$existing/$(basename "$info")"
              if ! test -f "$existing_info" || ! cmp -s "$existing_info" "$info"; then
                echo "Refusing to replace release assets built from a different compatibility tuple" >&2
                test ! -f "$existing_info" || diff -u "$existing_info" "$info" || true
                exit 1
              fi
            done
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$title" --notes "$notes"
          fi
